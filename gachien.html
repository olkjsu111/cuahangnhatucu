<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gà Chiên</title>
  <style>
      body {
      font-family: Arial, sans-serif;
      background-image: url('anh/nen.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat; 
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ff7f50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .product-detail {
      max-width: 800px;
      margin: 50px auto;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 2rem;
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .product-detail img {
      max-width: 300px;
      border-radius: 10px;
    }

    .product-info h2 {
      margin-top: 0;
    }

    .product-info p {
      font-size: 1.1rem;
    }

    .price {
      color: #e67300;
      font-weight: bold;
      font-size: 1.2rem;
      margin: 1rem 0;
    }

    .buy-btn {
      background-color: #ff6600;
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    .buy-btn:hover {
      background-color: #cc5200;
    }
  </style>
</head>
<body>
  <header>
    <h1>✨Cửa Hàng Tucu</h1>
    <nav>
      <a href="trangchu.html">Trang Chủ</a>
      <a href="dangnhap.html">Đăng Nhập</a>
      <a href="dangky.html">Đăng Ký</a>
      <a href="lienhe.html">Liên Hệ</a>
    </nav>
  </header>

  <div class="product-detail">
    <img src="anh/rachien.jpg" alt="Gà chiên">
    <div class="product-info">
      <h2>Gà Chiên </h2>
      <p>Món ăn vặt khoái khẩu, thơm ngon, hấp dẫn mọi lứa tuổi.</p>
      <div class="price">Giá: 45.000đ</div>
      <button class="buy-btn">Mua Ngay</button>
    </div>
  </div>
</body>
</html>
