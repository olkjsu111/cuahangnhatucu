<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên Hệ</title>
  <style>
      body {
      font-family: Arial, sans-serif;
      background-image: url('anh/nen.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat; 
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ff7f50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .form-container {
      background-color: white;
      max-width: 500px;
      margin: 50px auto;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      width: 100%;
      background-color: #ff6600;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #cc5200;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-bar">
      <img src="anh/logo.png" alt="Logo Cửa Hàng" class="logo">
      <div class="title">
        <h1>✨ Cửa Hàng Tucu</h1>
        <p>Ngon - Rẻ - Giao Nhanh</p>
      </div>
    </div>
 
    <nav>
      <a href="trangchu.html">Trang Chủ</a>
      <a href="dangnhap.html">Đăng Nhập</a>
      <a href="dangky.html">Đăng Ký</a>
      <a href="lienhe.html">Liên Hệ</a>
    </nav>
  </header>

  <div class="form-container">
    <h2>Liên Hệ Với Chúng Tôi</h2>
    <form>
      <label for="name">Họ và tên:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Nội dung liên hệ:</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Gửi Liên Hệ</button>
    </form>
  </div>
</body>
</html>
